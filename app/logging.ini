[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access,aiosqlite,sqlalchemy,sqlalchemy.engine,sqlalchemy.pool,ib_insync,ib_insync.client,ib_insync.ib,numexpr,numexpr.utils

[handlers]
keys=default,access

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=default

[logger_uvicorn]
level=INFO
handlers=default
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=default
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=access
propagate=0
qualname=uvicorn.access

[logger_aiosqlite]
level=INFO
handlers=default
propagate=0
qualname=aiosqlite

[logger_sqlalchemy]
level=WARNING
handlers=default
propagate=0
qualname=sqlalchemy

[logger_sqlalchemy.engine]
level=WARNING
handlers=default
propagate=0
qualname=sqlalchemy.engine

[logger_sqlalchemy.pool]
level=WARNING
handlers=default
propagate=0
qualname=sqlalchemy.pool

[logger_ib_insync]
level=WARNING
handlers=default
propagate=0
qualname=ib_insync

[logger_ib_insync.client]
level=WARNING
handlers=default
propagate=0
qualname=ib_insync.client

[logger_ib_insync.ib]
level=WARNING
handlers=default
propagate=0
qualname=ib_insync.ib

[logger_numexpr]
level=WARNING
handlers=default
propagate=0
qualname=numexpr

[logger_numexpr.utils]
level=WARNING
handlers=default
propagate=0
qualname=numexpr.utils

[handler_default]
class=StreamHandler
formatter=default
args=(sys.stdout,)

[handler_access]
class=StreamHandler
formatter=access
args=(sys.stdout,)

[formatter_default]
class=uvicorn.logging.DefaultFormatter
format=%(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt=%Y-%m-%dT%H:%M:%S

[formatter_access]
class=uvicorn.logging.AccessFormatter
format=%(asctime)s | %(levelname)s | %(name)s | %(client_addr)s - "%(request_line)s" %(status_code)s
datefmt=%Y-%m-%dT%H:%M:%S
