name: Run Ruff formatter

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned: an unpinned linter silently changes what it enforces.
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: check
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: format --check
