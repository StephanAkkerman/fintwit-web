name: Run tests

# Path filters: a frontend- or docs-only change doesn't start the backend suite.
# Branch pushes other than main are left to the pull_request run, so a PR
# branch isn't tested twice per push.
on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - "tests/**"
            - "requirements.txt"
            - "pyproject.toml"
            - ".github/workflows/pytest.yml"
    pull_request:
        paths:
            - "app/**"
            - "tests/**"
            - "requirements.txt"
            - "pyproject.toml"
            - ".github/workflows/pytest.yml"
    workflow_dispatch:

# A new push to the same PR supersedes the run still going for the old one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: pyproject.toml

            # The `test` extra is a deliberate subset of requirements.txt: it
            # leaves out torch/transformers/timm, which app/ml imports lazily and
            # no test touches. Installing them pulled ~2.5 GB of CUDA wheels and
            # exhausted the runner's disk before pytest could start.
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[test]"

            # No --maxfail: report every failure in one run rather than one per
            # push, so a whole broken suite is visible at a glance.
            # The floor sits just under today's number so it ratchets rather
            # than drifts; raise it when coverage genuinely improves.
            - name: Run pytest
              run: python -m pytest --disable-warnings -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=71
