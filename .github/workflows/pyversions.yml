name: Check Python Versions

on:
  workflow_dispatch:
  push:
    paths:
      - 'requirements.txt'  # Dependency file
      - 'pyproject.toml'    # Runtime metadata and the [test] extra
      - 'setup.py'          # Setup script
      - '.github/workflows/pyversions.yml' #This file
permissions:
  contents: read

jobs:
  # Can the runtime manifest still be resolved on every supported version?
  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
            python-version: ${{ matrix.python-version }}

      - name: Resolve everything (dry-run)
        run: |
            python -m pip install --upgrade pip setuptools wheel
            pip install --dry-run -r requirements.txt

  # And does the suite actually pass there? The `test` extra is light enough to
  # install across the matrix, which a dry-run resolve alone never proved.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -e ".[test]"

      - name: Run pytest
        run: python -m pytest --disable-warnings -q
