name: Publish Docker images

# Prebuilt multi-arch images so a self-hosted install is `docker compose up -d`
# instead of compiling the PyTorch stack locally (slow on a Raspberry Pi).
# docker-compose.yml names these images; `--build` still builds from source.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Merging several PRs back to back queues a run per push; only the newest
# one still matters, so cancel any older run still building for the same
# ref. Tag pushes each get their own ref and are never cancelled this way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fintwit-web-backend
            context: .
            filter: backend
          - image: fintwit-web-frontend
            context: ./frontend
            filter: frontend

    steps:
      - uses: actions/checkout@v7

      # On a plain push to main, skip rebuilding the image whose context
      # didn't change (the backend image bundles the PyTorch stack, so this
      # is the expensive one to redo). Tags and manual runs always build both.
      - id: changes
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '!frontend/**'
            frontend:
              - 'frontend/**'

      # arm64 is emulated; it is what Raspberry Pi hosts pull.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        if: steps.changes.outcome == 'skipped' || steps.changes.outputs[matrix.filter] == 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
