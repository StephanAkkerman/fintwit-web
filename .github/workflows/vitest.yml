name: Frontend tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            # `vite build` uses esbuild, which strips types without checking
            # them, so the type errors only surface here.
            - name: Typecheck
              run: npx tsc --noEmit

            - name: Run Vitest
              run: npm test

            # A component no test imports can still break the bundle.
            - name: Build
              run: npm run build
