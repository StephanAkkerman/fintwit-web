name: Frontend tests

# Only frontend changes start this. Branch pushes other than main are left to
# the pull_request run, so a PR branch isn't tested twice per push.
on:
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - "!frontend/**/*.md"
            - ".github/workflows/vitest.yml"
    pull_request:
        paths:
            - "frontend/**"
            - "!frontend/**/*.md"
            - ".github/workflows/vitest.yml"
    workflow_dispatch:

# A new push to the same PR supersedes the run still going for the old one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            # `vite build` uses esbuild, which strips types without checking
            # them, so the type errors only surface here.
            - name: Typecheck
              run: npx tsc --noEmit

            - name: Run Vitest
              run: npm test

            # A component no test imports can still break the bundle.
            - name: Build
              run: npm run build
