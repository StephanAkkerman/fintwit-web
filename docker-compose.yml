# Docker's default json-file driver keeps container logs forever. On the Pi
# that fills the SD card: a single unreachable upstream can emit tens of
# thousands of retry warnings a day (see ticker-price-data's TradingView
# reconnect loop). Cap every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ibgateway:
    # Optional: only needed for Interactive Brokers portfolio sync. Started
    # with `docker compose --profile ibkr up -d` (also set IBKR_ENABLED=true
    # in .env so the backend actually uses it).
    profiles: ["ibkr"]
    # https://github.com/gnzsnz/ib-gateway-docker — supports ARM64 (Raspberry Pi)
    # Replace with ghcr.io/gnzsnz/ib-gateway:stable for a pinned release
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: fintwit-ibgateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      # Use live by default; override with TRADING_MODE=paper if needed.
      TRADING_MODE: ${TRADING_MODE:-live}
      READ_ONLY_API: "yes"
      # Headless-friendly defaults for API reliability.
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:45 PM}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-changeme}
    volumes:
      - ./ibgateway-settings:${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    ports:
      - "127.0.0.1:4001:4003" # TWS API (live; socat)
      - "127.0.0.1:4002:4004" # TWS API (paper; socat)
      - "127.0.0.1:5901:5900" # VNC (optional inspection)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.8.0}
    container_name: fintwit-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_URL: sqlite+aiosqlite:///./state/data.db
      API_KEY: ${API_KEY:-}
      CHART_ENABLED: ${CHART_ENABLED:-true}
      CHART_EXTRACTION_ENABLED: ${CHART_EXTRACTION_ENABLED:-true}
      # Only takes effect if the ibgateway service is also started (the
      # `ibkr` profile); the sync worker retries its own connection, so no
      # container start-order dependency is needed here.
      IBKR_ENABLED: ${IBKR_ENABLED:-false}
      IBKR_HOST: ibgateway
      # Keep this aligned with TRADING_MODE (live=4003, paper=4004).
      IBKR_PORT: ${IBKR_PORT:-4003}
      IBKR_SYNC_INTERVAL: "60"
      # How often the portfolio value snapshot worker records total value.
      PORTFOLIO_SNAPSHOT_INTERVAL: ${PORTFOLIO_SNAPSHOT_INTERVAL:-1800}
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:7999:7999"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintwit-frontend
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:80"

  cloudflared:
    # Optional: only needed to expose the dashboard publicly. Started with
    # `docker compose --profile tunnel up -d` once infra/ has provisioned a
    # tunnel token (see README's Cloudflare Tunnel deploy steps). Leave this
    # profile off to keep the stack reachable only from localhost/your LAN.
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: fintwit-cloudflared
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    logging: *default-logging
