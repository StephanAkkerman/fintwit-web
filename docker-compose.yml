services:
  ibgateway:
    # https://github.com/gnzsnz/ib-gateway-docker — supports ARM64 (Raspberry Pi)
    # Replace with ghcr.io/gnzsnz/ib-gateway:stable for a pinned release
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: fintwit-ibgateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      # Use live by default; override with TRADING_MODE=paper if needed.
      TRADING_MODE: ${TRADING_MODE:-live}
      READ_ONLY_API: "yes"
      # Headless-friendly defaults for API reliability.
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:45 PM}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-changeme}
    volumes:
      - ibgateway-settings:${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    ports:
      - "127.0.0.1:4001:4003" # TWS API (live; socat)
      - "127.0.0.1:4002:4004" # TWS API (paper; socat)
      - "127.0.0.1:5901:5900" # VNC (optional inspection)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintwit-backend
    restart: unless-stopped
    depends_on:
      - ibgateway
    environment:
      DB_URL: sqlite+aiosqlite:///./state/data.db
      API_KEY: ${API_KEY:-}
      IBKR_ENABLED: "true"
      IBKR_HOST: ibgateway
      # Keep this aligned with TRADING_MODE (live=4003, paper=4004).
      IBKR_PORT: ${IBKR_PORT:-4003}
      IBKR_SYNC_INTERVAL: "60"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintwit-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fintwit-cloudflared
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  ibgateway-settings:
