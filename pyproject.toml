[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintwit-web"
version = "0.1.0"
description = "Financial Twitter web application"
requires-python = ">=3.11"

# Everything needed to run `pytest`, and nothing else. Install with:
#
#     pip install -e ".[test]"
#
# `requirements.txt` stays the runtime/production manifest; this extra is
# deliberately a subset of it. The ML stack (torch, transformers, timm, Pillow)
# is left out because `app/ml/` imports it lazily inside functions, so no test
# touches it — installing it pulls ~2.5 GB of CUDA wheels and previously filled
# the CI runner's disk before a single test ran. Anything added here that also
# appears in requirements.txt must carry the same version specifier; that is
# enforced by tests/test_dependency_manifests.py.
[project.optional-dependencies]
test = [
    "aiohttp",
    "aiosqlite<=0.17.0",
    "asyncpraw==7.8.1",
    "exchange_calendars",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "ib_insync==0.9.86",
    "lxml==6.0.4",
    "pandas",
    "pydantic",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov",
    "python-dateutil==2.9.0",
    "sqlalchemy[asyncio]==2.0.49",
    "ticker-classifier==0.1.5",
    "ticker-price-data==0.1.5",
    "tradingview-scraper==0.4.20",
    "tradingview-ta==3.3.0",
    "xtimeline==0.1.6",
    "yfinance==1.7.0",
]

# Tooling for working on the app locally: running it and capturing the UI.
# Separate from `test` so CI installs neither Playwright nor a browser.
dev = [
    "playwright",
    "uvicorn==0.43.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[tool.ruff]
line-length = 88
# Also pinned: 0.16 added Markdown to the default discovery set, so the
# formatter started rewriting Python code blocks inside docs/. Restrict it to
# Python, as it was.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's default rule set widened in
# 0.16, which turned a clean tree into 188 findings without a line of code
# changing — BLE001, UP045, B008 and friends. These four are the set this
# codebase was written against and is clean against. Adopting the wider set is
# worth doing, but as its own change rather than as a silent CI break.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "numpy"
